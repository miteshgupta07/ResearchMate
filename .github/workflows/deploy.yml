name: Deploy ResearchMate

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff
        run: ruff check .


  test:
    needs: lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: |
          pytest -v


  deploy:
    needs: [lint, test]

    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Deploy it')

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ResearchMate

            git fetch origin
            git reset --hard origin/main

            source venv/bin/activate

            sudo systemctl restart researchmate_backend
            sudo systemctl restart researchmate_frontend

            sleep 30

      - name: Smoke Test Backend
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error https://api.researchmate.me/health; then
              echo "Backend is healthy."
              exit 0
            fi

            echo "Backend is not ready yet. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Backend failed to become healthy."
          exit 1

      - name: Smoke Test Frontend
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error https://researchmate.me; then
              echo "Frontend is healthy."
              exit 0
            fi

            echo "Frontend is not ready yet. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Frontend failed to become healthy."
          exit 1
